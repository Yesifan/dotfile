# ============================================================
# Codex Config
# Codex config.toml 配置参考：https://learn.chatgpt.com/docs/config-file/config-reference
# Codex 权限配置文档：https://learn.chatgpt.com/docs/permissions
# ============================================================
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

model_verbosity = "low"             # 输出极简
personality = "pragmatic"           # 务实风格
model_reasoning_summary = "concise" # 简短摘要

web_search = "live"
allow_login_shell = true
approval_policy = "on-request"

default_permissions = "dev"

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "permissions",
  "context-used",
  "weekly-limit",
  "total-input-tokens",
  "total-output-tokens",
]
status_line_use_colors = true

[features]
worktrees = true
network_proxy = true

[features.multi_agent_v2]
enabled = true
# 1 root + 最多 5 subagents
max_concurrent_threads_per_session = 6
# 允许等待长任务 subagent
wait_agent_enabled = true
# 允许 spawn 时为特定 subagent 选择不同模型 / reasoning effort。
expose_spawn_agent_model_overrides = true

[permissions.dev]
description = "General local software development"
extends = ":workspace"

[permissions.dev.filesystem]
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"

"~/" = "write"

# 收回敏感目录
"~/.ssh" = "deny"
"~/.gnupg" = "deny"
"~/.aws" = "deny"
"~/.kube" = "deny"
"~/.azure" = "deny"
"~/.config/gcloud" = "deny"
"~/.password-store" = "deny"

[permissions.dev.filesystem.":workspace_roots"]
"." = "write"
".git" = "write"
".git/**" = "write"

".codex" = "read"

"*.pem" = "deny"
"**/*.pem" = "deny"
"*.key" = "deny"
"**/*.key" = "deny"

[permissions.dev.network]
enabled = true
allow_local_binding = true

[permissions.dev.network.domains]
"*" = "allow"
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"

[permissions.dev.network.unix_sockets]
"/var/run/docker.sock" = "allow"

# MCP
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
default_tools_approval_mode = "approve"

# codex 自带的游览器插件可能效果更好，需要时在项目级启用
# [mcp_servers.playwright]
# command = "pnpm"
# args = ["dlx", "-y", "@playwright/mcp@latest"]
# default_tools_approval_mode = "approve"
