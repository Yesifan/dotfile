model = "gpt-5.6-luna"
model_reasoning_effort = "medium"

default_permissions = "dev"
approval_policy = "on-request"

model_verbosity = "low"             # 输出极简
personality = "pragmatic"           # 务实风格
model_reasoning_summary = "concise" # 简短摘要

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "permissions",
  "context-used",
  "weekly-limit",
  "total-input-tokens",
  "total-output-tokens",
]
status_line_use_colors = true

[features]
js_repl = false
workspace_dependencies = true

[features.network_proxy]
enabled = true

[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 6

[agents]
max_depth = 1

# permissions

[permissions.dev]
description = "Normal local dev"
extends = ":workspace"

[permissions.dev.filesystem]
glob_scan_max_depth = 8

":minimal" = "read"

# MAC
"~/Library/pnpm" = "write"
"~/Library/Caches/pnpm" = "write"

# Linux
"~/.npm" = "write"
"~/.nvm/versions/node" = "read"

"~/.cache/uv" = "write"
"~/.cache/Cypress" = "write"
"~/.cache/puppeteer" = "write"
"~/.cache/ms-playwright" = "write"
"~/.local/share/pnpm/store" = "write"

"~/.local/share/opencode" = "write"


[permissions.dev.filesystem.":workspace_roots"]
"." = "write"
".git" = "write"
".git/**" = "write"
"*.pem" = "deny"
"**/*.pem" = "deny"

"*.key" = "deny"
"**/*.key" = "deny"

[permissions.dev.network]
enabled = true
allow_local_binding = true

[permissions.dev.network.domains]
"::1" = "allow"
"localhost" = "allow"
"127.0.0.1" = "allow"


# ----------------------------------------
# npm / pnpm：依赖解析、下载、audit、发布
# ----------------------------------------
"www.npmjs.com" = "allow"
"registry.npmjs.org" = "allow"
"registry.npmmirror.com" = "allow"
"cdn.npmmirror.com" = "allow"

# ----------------------------------------
# Python / pip / uv：PyPI 依赖
# ----------------------------------------
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"
"upload.pypi.org" = "allow"
"bootstrap.pypa.io" = "allow"

# ----------------------------------------
# Node.js / pnpm / uv / Python 工具链安装
# ----------------------------------------
"nodejs.org" = "allow"
"get.pnpm.io" = "allow"
"astral.sh" = "allow"
"downloads.python.org" = "allow"
"www.python.org" = "allow"

# ----------------------------------------
# GitHub：Git 依赖、uv Python、Release 二进制
# ----------------------------------------
"github.com" = "allow"
"api.github.com" = "allow"
"codeload.github.com" = "allow"
"**.githubusercontent.com" = "allow"

# ----------------------------------------
# 可选：uv Docker 镜像、GitHub Container Registry
# ----------------------------------------
"ghcr.io" = "allow"
"pkg-containers.githubusercontent.com" = "allow"


[permissions.dev.network.unix_sockets]
"/var/run/docker.sock" = "allow"

# MCP
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
default_tools_approval_mode = "approve"

[mcp_servers.playwright]
command = "pnpm"
args = ["dlx", "-y", "@playwright/mcp@latest"]
default_tools_approval_mode = "approve"
